<text x="26" y="396" font-size="12" fill="#5f6b73">VIEW-A03 · VP-A03 Contexto · Concerns C02/C06 · Grupo 04 · v0.3 (PC3)</text>
<text x="26" y="413" font-size="12" fill="#5f6b73">Grouping = alcance (de la recepción con origen a la entrega del FCL, DEC-B06); fundo y transportista quedan fuera. Handoffs críticos: HO-01 (S1), HO-03 (S3) y</text>
<text x="26" y="430" font-size="12" fill="#5f6b73">HO-05 (S6).</text>
<text x="26" y="447" font-size="12" fill="#5f6b73">Las etapas anidadas en el Grouping expresan su Aggregation. Fuera de alcance: cosecha, transporte marítimo, puertos y ERP corporativo (solo interfaz).</text>
<text x="26" y="464" font-size="11" fill="#7c868d">Notación ArchiMate 3.2: Assignment (●→) · Realization (- - ▷) · Serving (→ abierta) · Access (··· ; flecha = dirección del dato: escribe →objeto, lee →proceso) · Triggering (→</text>
<text x="26" y="481" font-size="11" fill="#7c868d">llena) · Flow (- - → llena) · Composition (◆) · Aggregation (◇) · Influence (- - →, +) · Association (—). Anidamiento = relación estructural del modelo.</text>
