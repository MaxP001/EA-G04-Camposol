<text x="26" y="597.0" font-size="12" fill="#5f6b73">VIEW-A04 · VP-A04 Concepto de solución · Concerns C03/C04/C05 · Grupo 04 · v0.3 (PC3)</text>
<text x="26" y="614.0" font-size="12" fill="#5f6b73">Principio → requisito → servicio candidato → proceso/objeto: cada candidato realiza un REQ y se justifica por un principio (Value Before Technology). Sin producto ni topología (PR-05). Candidatos de</text>
<text x="26" y="631.0" font-size="12" fill="#5f6b73">Phase A; Phase C los detalla (ASV-C01 → ASV-01, ASV-C02 → ASV-02, DO-C01 → DOBJ-12).</text>
<text x="26" y="648.0" font-size="11" fill="#7c868d">Notación ArchiMate 3.2: Assignment (●→) · Realization (- - ▷) · Serving (→ abierta) · Access (··· ; flecha = dirección del dato: escribe →objeto, lee →proceso) · Triggering (→ llena) · Flow (- - → llena) · Composition (◆) ·</text>
<text x="26" y="665.0" font-size="11" fill="#7c868d">Aggregation (◇) · Influence (- - →, +) · Association (—). Anidamiento = relación estructural del modelo.</text>
