<text x="26" y="613" font-size="12" fill="#5f6b73">La historia se concilia con BP-09 sobre la planilla BO-09; Despacho (BP-07) lee la planilla, no el resultado de inspección BO-03 (DS-CS-06). ✕ = eliminado en Target (B-04).</text>
<text x="26" y="630" font-size="12" fill="#5f6b73">Quién ejecuta cada proceso: B-V05. Servicios que consume cada rol: B-V04.</text>
<text x="26" y="647" font-size="11" fill="#7c868d">Notación ArchiMate 3.2: Assignment (●→) · Realization (- - ▷) · Serving (→ abierta) · Access (··· ; flecha = dirección del dato: escribe →objeto, lee →proceso) · Triggering (→ llena) · Flow (- - → llena) · Composition</text>
<text x="26" y="664" font-size="11" fill="#7c868d">(◆) · Aggregation (◇) · Influence (- - →, +) · Association (—). Anidamiento = relación estructural del modelo.</text>
