<text x="26" y="563.0" font-size="12" fill="#5f6b73">B-V03 · VP-B02 Value stream × capacidades · Grupo 04 · v0.3 (PC3)</text>
<text x="26" y="580.0" font-size="12" fill="#5f6b73">Etapas anidadas en VS-01 = Composition. Fila superior: capacidad primaria (P) de cada etapa (Serving a la etapa, B-03). Fila inferior: CAP-05 y CAP-06, transversales (S en varias etapas), con Serving al value stream completo. Las 7 capacidades del catálogo están en la vista. Handoffs críticos: HO-01 (S1), HO-03 (S3) y</text>
<text x="26" y="597.0" font-size="12" fill="#5f6b73">HO-05 (S6).</text>
<text x="26" y="614.0" font-size="11" fill="#7c868d">Notación ArchiMate 3.2: Assignment (●→) · Realization (- - ▷) · Serving (→ abierta) · Access (··· ; flecha = dirección del dato: escribe →objeto, lee →proceso) · Triggering (→ llena) · Flow (- - → llena) · Composition (◆) · Aggregation (◇) · Influence (- - →, +) · Association (—). Anidamiento = relación estructural del modelo.</text>
