<text x="26" y="876" font-size="12" fill="#5f6b73">B-V04 · VP-B03 Servicios y eventos · Grupo 04 · v0.3 (PC3)</text>
<text x="26" y="893" font-size="12" fill="#5f6b73">Evento → proceso → servicio de negocio → rol que lo consume; BP-04 (historia) y BP-08 (excepciones) son los procesos transversales nuevos.</text>
<text x="26" y="910" font-size="12" fill="#5f6b73">Concern acotado: la secuencia entre procesos está en B-V02 y la asignación rol → proceso en B-V05.</text>
<text x="26" y="927" font-size="11" fill="#7c868d">Notación ArchiMate 3.2: Assignment (●→) · Realization (- - ▷) · Serving (→ abierta) · Access (··· ; flecha = dirección del dato: escribe →objeto, lee →proceso) · Triggering (→</text>
<text x="26" y="944" font-size="11" fill="#7c868d">llena) · Flow (- - → llena) · Composition (◆) · Aggregation (◇) · Influence (- - →, +) · Association (—). Anidamiento = relación estructural del modelo.</text>
