<text x="26" y="373.0" font-size="12" fill="#5f6b73">AP-V01-B · VP-C06 · C03/C07 · Grupo 04 · v0.3 (PC3)</text>
<text x="26" y="390.0" font-size="12" fill="#5f6b73">Baseline IA (DS-CS-25), misma rejilla que AP-V01-T. No hay interfaces de aplicación: los traspasos son planilla por turno, correo, CSV nocturno y exportación manual, y la planilla puente AP-07 alimenta SAP por digitación.</text>
<text x="26" y="407.0" font-size="12" fill="#5f6b73">Comparar con AP-V01-T: la ingesta AP-08 ocupa el lugar de AP-07 y cada flujo pasa a un contrato IF versionado.</text>
<text x="26" y="424.0" font-size="11" fill="#7c868d">Notación ArchiMate 3.2: Assignment (●→) · Realization (- - ▷) · Serving (→ abierta) · Access (··· ; flecha = dirección del dato: escribe →objeto, lee →proceso) · Triggering (→ llena) · Flow (- - → llena) · Composition (◆) · Aggregation (◇) ·</text>
<text x="26" y="441.0" font-size="11" fill="#7c868d">Influence (- - →, +) · Association (—). Anidamiento = relación estructural del modelo.</text>
