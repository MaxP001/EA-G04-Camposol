<text x="26" y="947.0" font-size="12" fill="#5f6b73">AP-V02-B · VP-C09 · C01/C03 · Grupo 04 · v0.3 (PC3)</text>
<text x="26" y="964.0" font-size="12" fill="#5f6b73">Baseline IA (DS-CS-25) · responde «¿qué actividad o servicio de negocio habilita cada aplicación?» (guía PC3 §4.5, AP-V02 Baseline). No existen</text>
<text x="26" y="981.0" font-size="12" fill="#5f6b73">servicios de aplicación: cada aplicación sirve directamente a su proceso (Serving, clase IA, según C2/Proceso_x_App) y el proceso realiza el servicio</text>
<text x="26" y="998.0" font-size="12" fill="#5f6b73">de negocio de B-V01. La historia del lote (BSV-06 consulta ad hoc) depende de la conciliación manual BP-09 sobre la planilla puente AP-07.</text>
<text x="26" y="1015.0" font-size="12" fill="#5f6b73">Comparar con AP-V02-T (Target).</text>
<text x="26" y="1032.0" font-size="11" fill="#7c868d">Notación ArchiMate 3.2: Assignment (●→) · Realization (- - ▷) · Serving (→ abierta) · Access (··· ; flecha = dirección del dato: escribe →objeto, lee →proceso) ·</text>
<text x="26" y="1049.0" font-size="11" fill="#7c868d">Triggering (→ llena) · Flow (- - → llena) · Composition (◆) · Aggregation (◇) · Influence (- - →, +) · Association (—). Anidamiento = relación estructural del modelo.</text>
</svg>