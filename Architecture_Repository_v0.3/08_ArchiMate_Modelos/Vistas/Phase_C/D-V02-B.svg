<text x="26" y="573.0" font-size="12" fill="#5f6b73">D-V02-B · VP-C03 · C01/C04 · Grupo 04 · v0.3 (PC3)</text>
<text x="26" y="590.0" font-size="12" fill="#5f6b73">Baseline IA (DS-CS-13/19/25), misma fila de fuentes que D-V02-T. Linaje Baseline: cada fuente escribe su propio código; la planilla puente AP-07 lee recepción, packing, Calidad y lecturas térmicas, escribe las correspondencias manuales DOB-B07 y alimenta SAP por digitación.</text>
<text x="26" y="607.0" font-size="12" fill="#5f6b73">No hay producto de datos ni consulta por rol: la historia se reconstruye a mano (KPI-01, 120 min, IA).</text>
<text x="26" y="624.0" font-size="11" fill="#7c868d">Notación ArchiMate 3.2: Assignment (●→) · Realization (- - ▷) · Serving (→ abierta) · Access (··· ; flecha = dirección del dato: escribe →objeto, lee →proceso) · Triggering (→ llena) · Flow (- - → llena) · Composition (◆) · Aggregation (◇) · Influence (- - →, +) · Association (—). Anidamiento = relación</text>
<text x="26" y="641.0" font-size="11" fill="#7c868d">estructural del modelo.</text>
</svg>