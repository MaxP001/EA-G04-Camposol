<text x="26" y="893" font-size="12" fill="#5f6b73">Linaje: fuentes → contratos IF → validación y reconciliación (AF-01) → composición (AF-02) → producto de datos LotHistory → consulta autorizada por rol. Genealogía ≠ linaje.</text>
<text x="26" y="910" font-size="12" fill="#5f6b73">Linaje Baseline comparable: D-V02-B.</text>
<text x="26" y="927" font-size="11" fill="#7c868d">Notación ArchiMate 3.2: Assignment (●→) · Realization (- - ▷) · Serving (→ abierta) · Access (··· ; flecha = dirección del dato: escribe →objeto, lee →proceso) · Triggering (→ llena) · Flow (- - → llena) · Composition (◆) · Aggregation (◇) ·</text>
<text x="26" y="944" font-size="11" fill="#7c868d">Influence (- - →, +) · Association (—). Anidamiento = relación estructural del modelo.</text>
