<text x="26" y="890.0" font-size="12" fill="#5f6b73">X-V01 · VP-C07 · C01/C07 · Grupo 04 · v0.3 (PC3)</text>
<text x="26" y="907.0" font-size="12" fill="#5f6b73">Cadena de historia: CAP-01 → BSV-01 → BP-04 ← ASV-02 ← AF-02 (AP-09) → LotHistory. Cadena de liberación: CAP-07 → BSV-05 → BP-03 escribe BO-03 ← QAResult ← ASV-03 → BP-07 (solo</text>
<text x="26" y="924.0" font-size="12" fill="#5f6b73">lee).</text>
<text x="26" y="941.0" font-size="12" fill="#5f6b73">Concern acotado a la alineación entre capas: la secuencia entre procesos está en B-V02 y los consumidores de servicios en B-V04.</text>
<text x="26" y="958.0" font-size="11" fill="#7c868d">Notación ArchiMate 3.2: Assignment (●→) · Realization (- - ▷) · Serving (→ abierta) · Access (··· ; flecha = dirección del dato: escribe →objeto, lee →proceso) · Triggering (→ llena) · Flow (- - →</text>
<text x="26" y="975.0" font-size="11" fill="#7c868d">llena) · Composition (◆) · Aggregation (◇) · Influence (- - →, +) · Association (—). Anidamiento = relación estructural del modelo.</text>
