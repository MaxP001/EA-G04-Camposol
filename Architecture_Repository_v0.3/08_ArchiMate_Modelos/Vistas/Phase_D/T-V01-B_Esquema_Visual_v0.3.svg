<text x="26" y="393.0" font-size="12" fill="#5f6b73">T-V01-B · VP-D12 · C02/C04 · Grupo 04 · v0.3 (PC3)</text>
<text x="26" y="410.0" font-size="12" fill="#5f6b73">Baseline IA (DS-CS-31…41) · responde «¿dónde se despliegan los componentes y servicios?» (guía PC3 §4.5, T-V01 Baseline). Cada aplicación Baseline corre en un PC o en el servidor local (Serving nodo → aplicación); las planillas AP-03, AP-04 y AP-07 viven en PCs de oficina y en la carpeta</text>
<text x="26" y="427.0" font-size="12" fill="#5f6b73">del servidor único T-BASE06, cuyo único servicio técnico es el respaldo semanal manual TS-13. SAP corre en la plataforma corporativa (HP F01/F02). No hay artefactos versionados en la Baseline (GAP-T04, GAP-T06). Ubicaciones y red: T-V02-B. Target: T-V01-T (plataforma y artefactos), T-V05</text>
<text x="26" y="444.0" font-size="12" fill="#5f6b73">(nodos) y T-V06 (servicios).</text>
<text x="26" y="461.0" font-size="11" fill="#7c868d">Notación ArchiMate 3.2: Assignment (●→) · Realization (- - ▷) · Serving (→ abierta) · Access (··· ; flecha = dirección del dato) · Triggering (→ llena) · Flow (- - → llena) · Composition (◆) · Aggregation (◇) · Association (—). Anidamiento = relación estructural del modelo (Aggregation, Composition o Assignment).</text>
