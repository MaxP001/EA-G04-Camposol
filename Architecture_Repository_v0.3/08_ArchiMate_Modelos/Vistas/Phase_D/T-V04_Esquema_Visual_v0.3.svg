<text x="26" y="930.0" font-size="12" fill="#5f6b73">T-V04 · VP-D04 · C04/C06 · Grupo 04 · v0.3 (PC3)</text>
<text x="26" y="947.0" font-size="12" fill="#5f6b73">Target (DE) · escenarios E1/E2 (DS-CS-47/48). El evento se persiste en la cola local antes de confirmarse; con WAN, se reenvía en orden y se depura solo tras el ack central; al volver el enlace, el backlog se</text>
<text x="26" y="964.0" font-size="12" fill="#5f6b73">reenvía y la ingesta deduplica por clave de hecho (AF-01). Durante el corte, Despacho consulta el estado QA en la réplica local (TS-14). Anidamiento = Assignment del nodo a su proceso o artefacto. Deduplicación:</text>
<text x="26" y="981.0" font-size="12" fill="#5f6b73">AP-V01-T y C2/Operabilidad.</text>
<text x="26" y="998.0" font-size="11" fill="#7c868d">Notación ArchiMate 3.2: Assignment (●→) · Realization (- - ▷) · Serving (→ abierta) · Access (··· ; flecha = dirección del dato) · Triggering (→ llena) · Flow (- - → llena) · Composition (◆) · Aggregation (◇) · Association (—).</text>
<text x="26" y="1015.0" font-size="11" fill="#7c868d">Anidamiento = relación estructural del modelo (Aggregation, Composition o Assignment).</text>
</svg>