<text x="26" y="772.0" font-size="12" fill="#5f6b73">Target (DE) · nivel físico-conceptual, sin modelo ni marca. Separa instalación (Facility), equipo físico (Equipment), dispositivo (Device) y nodo de cómputo (Node). PLC, HMI y registro térmico se mantienen (Included); la sala técnica concentra borde redundante, gateway OT de solo lectura, tiempo, cortafuegos y bastión; el entorno central (T-TAR08, DC o nube: NV-10) agrupa runtime, almacén</text>
<text x="26" y="789.0" font-size="12" fill="#5f6b73">y respaldo. T-BASE06 se elimina. Redes: T-V02-T; zonas y conductos: T-V02-Z.</text>
<text x="26" y="806.0" font-size="11" fill="#7c868d">Notación ArchiMate 3.2: Assignment (●→) · Realization (- - ▷) · Serving (→ abierta) · Access (··· ; flecha = dirección del dato) · Triggering (→ llena) · Flow (- - → llena) · Composition (◆) · Aggregation (◇) · Association (—). Anidamiento = relación estructural del modelo (Aggregation, Composition o Assignment).</text>
