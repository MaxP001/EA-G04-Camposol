<text x="26" y="811.0" font-size="12" fill="#5f6b73">T-V10 · VP-D10 · C05 · Grupo 04 · v0.3 (PC3)</text>
<text x="26" y="828.0" font-size="12" fill="#5f6b73">candidatos sin presupuesto ni fechas (calendario en Phase E). Cada Gap compara la misma unidad Baseline/Target (T1/05) y se asocia al candidato que la resuelve; Triggering = dependencia de inicio. La fila central es la secuencia principal: inventario pasivo (TD-RC01, P0) → segmentación (TD-RC02, P0) → luego borde y tiempo (TD-RC03), identidad (TD-RC04) y vínculo</text>
<text x="26" y="845.0" font-size="12" fill="#5f6b73">térmico (TD-RC05); después plataforma central (TD-RC06) y SAP (TD-RC07). GAP-T09 y TD-RC08 se retiraron (OPP-IA-01, DEC-D09). Prioridades y dependencias con D-RC/A-RC: T1/06 y T-04; las plateaus Baseline/Target de cada gap están en T-V11.</text>
<text x="26" y="862.0" font-size="11" fill="#7c868d">Notación ArchiMate 3.2: Assignment (●→) · Realization (- - ▷) · Serving (→ abierta) · Access (··· ; flecha = dirección del dato) · Triggering (→ llena) · Flow (- - → llena) · Composition (◆) · Aggregation (◇) · Association (—). Anidamiento = relación estructural del modelo (Aggregation, Composition o Assignment).</text>
</svg>