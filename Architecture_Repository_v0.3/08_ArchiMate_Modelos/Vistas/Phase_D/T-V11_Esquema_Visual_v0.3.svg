<text x="26" y="967.0" font-size="12" fill="#5f6b73">T-V11 · VP-D10 · C05 · Grupo 04 · v0.3 (PC3)</text>
<text x="26" y="984.0" font-size="12" fill="#5f6b73">Baseline IA y Target DE. Cada Gap se asocia a las dos plateaus que compara (ArchiMate 3.2); el candidato que lo resuelve está en T-V10. La transición PLT-01 → PLT-02 no tiene fechas:</text>
<text x="26" y="1001.0" font-size="12" fill="#5f6b73">Phase E define las Transition Architectures intermedias (DEC-PC3-06).</text>
<text x="26" y="1018.0" font-size="11" fill="#7c868d">Notación ArchiMate 3.2: Assignment (●→) · Realization (- - ▷) · Serving (→ abierta) · Access (··· ; flecha = dirección del dato) · Triggering (→ llena) · Flow (- - → llena) · Composition (◆) · Aggregation (◇) ·</text>
<text x="26" y="1035.0" font-size="11" fill="#7c868d">Association (—). Anidamiento = relación estructural del modelo (Aggregation, Composition o Assignment).</text>
