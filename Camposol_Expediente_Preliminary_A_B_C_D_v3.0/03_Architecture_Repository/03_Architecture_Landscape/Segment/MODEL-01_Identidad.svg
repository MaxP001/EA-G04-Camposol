<text text-anchor="start" x="8" y="-19.2" font-family="Arial" font-size="11.00">Genealogía N:M: un pallet puede tener varios batches padre (mezcla, DS&#45;CS&#45;04) y un batch varios hijos (división). Ningún pallet sin padre (PR&#45;02).</text>
<text text-anchor="start" x="22.5" y="-7.2" font-family="Arial" font-size="11.00">El resultado de inspección conserva el estado HOLD; Despacho solo lo lee (PR&#45;07). Origen de cosecha es referencia de entrada (DEC&#45;B06).</text>
