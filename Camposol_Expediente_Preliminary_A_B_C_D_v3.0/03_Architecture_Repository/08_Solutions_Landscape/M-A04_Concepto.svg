<text x="26" y="596" font-size="12" fill="#5f6b73">VIEW-A04 · VP-A04 Concepto de solución · Concerns C03/C04/C05 · Grupo 04 · v0.4</text>
<text x="26" y="613" font-size="12" fill="#5f6b73">Principio → requisito → servicio candidato → proceso/objeto: cada candidato realiza un REQ y se justifica por un principio (Value Before Technology). Sin</text>
<text x="26" y="630" font-size="12" fill="#5f6b73">producto ni topología (PR-05).</text>
<text x="26" y="647" font-size="12" fill="#5f6b73">Candidatos de Phase A; Phase C los detalla (ASV-C01 → ASV-01, ASV-C02 → ASV-02, DO-C01 → DOBJ-12).</text>
<text x="26" y="664" font-size="11" fill="#7c868d">Notación ArchiMate 3.2: Assignment (●→) · Realization (- - ▷) · Serving (→ abierta) · Access (··· ; flecha = dirección del dato: escribe →objeto, lee →proceso) · Triggering (→</text>
<text x="26" y="681" font-size="11" fill="#7c868d">llena) · Flow (- - → llena) · Composition (◆) · Aggregation (◇) · Influence (- - →, +) · Association (—). Anidamiento = relación estructural del modelo.</text>
