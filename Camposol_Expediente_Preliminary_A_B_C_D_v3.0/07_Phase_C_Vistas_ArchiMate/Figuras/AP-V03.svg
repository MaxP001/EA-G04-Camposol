<text x="26" y="1044.0" font-size="12" fill="#5f6b73">AP-V03 · VP-C06 · C03/C07 · Grupo 04 · v3.0 · Target (D) · componentes Target = ABB lógicos (nuevos)</text>
<text x="26" y="1061.0" font-size="12" fill="#5f6b73">Productores publican por contrato IF-01…04/06 hacia la ingesta; SAP y el portal consumen por IF-05 en solo lectura: ninguna aplicación libera lotes (PR-07).</text>
<text x="26" y="1078.0" font-size="12" fill="#5f6b73">Concern acotado a Target: el flujo Baseline AP-02 → AP-03 está en AP-V01.</text>
<text x="26" y="1095.0" font-size="11" fill="#7c868d">Notación ArchiMate 3.2: Assignment (●→) · Realization (- - ▷) · Serving (→ abierta) · Access (··· ; flecha = dirección del dato: escribe →objeto, lee →proceso) · Triggering (→ llena) · Flow (- - →</text>
<text x="26" y="1112.0" font-size="11" fill="#7c868d">llena) · Composition (◆) · Aggregation (◇) · Influence (- - →, +) · Association (—). Anidamiento = relación estructural del modelo.</text>
