<text x="26" y="706.0" font-size="12" fill="#5f6b73">T-V01 · VP-D01 · C02/C06 · Grupo 04 · v3.0</text>
<text x="26" y="723.0" font-size="12" fill="#5f6b73">Baseline simulado (DS-CS-31…41). LOC-01 (Phase B) agrega las instalaciones FAC-01…03; las calibradoras y el frío son Equipment con su PLC y sondas. Una LAN plana (T-BASE08) une oficina, calibradoras y registro térmico; un</text>
<text x="26" y="740.0" font-size="12" fill="#5f6b73">servidor local único guarda las planillas con respaldo semanal sin prueba (TS-13); un único enlace WAN (T-BASE09) lleva a SAP. Un activo no inventariado no equivale a inexistente (NV). Aplicaciones residentes:</text>
<text x="26" y="757.0" font-size="12" fill="#5f6b73">T1/08_App_Technology y AP-V01.</text>
<text x="26" y="774.0" font-size="11" fill="#7c868d">Notación ArchiMate 3.2: Assignment (●→) · Realization (- - ▷) · Serving (→ abierta) · Access (··· ; flecha = dirección del dato) · Triggering (→ llena) · Flow (- - → llena) · Composition (◆) · Aggregation (◇) · Association (—). Anidamiento =</text>
<text x="26" y="791.0" font-size="11" fill="#7c868d">relación estructural del modelo (Aggregation, Composition o Assignment).</text>
</svg>