<text x="26" y="811.0" font-size="12" fill="#5f6b73">T-V09 · VP-D09 · C04/C06 · Grupo 04 · v3.0</text>
<text x="26" y="828.0" font-size="12" fill="#5f6b73">Target (D) · RTO/RPO propuestos, ratificación NV-07. Planta: la cola y la réplica local sostienen NFR-T01 (autonomía ≥ 24 h, RPO 0 para eventos confirmados). Central: runtime, observabilidad y respaldo inmutable fuera de sitio sostienen NFR-T04 (≥ 99,5 %, RTO ≤ 4 h, RPO</text>
<text x="26" y="845.0" font-size="12" fill="#5f6b73">≤ 15 min). Un RTO central de 4 h es aceptable porque Despacho verifica el estado QA en la réplica local (DEC-D04). Energía de sala técnica: NV-12. Procesamiento del corte: T-V04. Los requisitos NFR-T01/NFR-T04 se verifican con TEST-T01/T04 (T1/04).</text>
<text x="26" y="862.0" font-size="11" fill="#7c868d">Notación ArchiMate 3.2: Assignment (●→) · Realization (- - ▷) · Serving (→ abierta) · Access (··· ; flecha = dirección del dato) · Triggering (→ llena) · Flow (- - → llena) · Composition (◆) · Aggregation (◇) · Association (—). Anidamiento = relación estructural del modelo (Aggregation,</text>
<text x="26" y="879.0" font-size="11" fill="#7c868d">Composition o Assignment).</text>
