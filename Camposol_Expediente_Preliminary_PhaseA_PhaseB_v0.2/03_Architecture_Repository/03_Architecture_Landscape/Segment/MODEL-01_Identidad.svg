y="650" width="360" height="120" fill="#f2fcf4" stroke="#45d68c" stroke-width="3"/><text x="240.0" y="702.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" fill="#262437"><tspan x="240.0" dy="0">Lectura_PreFrio</tspan></text><rect x="485" y="657" width="420" height="120" fill="#eeeeee"/><rect x="480" y="650" width="420" height="120" fill="#f7f3ff" stroke="#a68af9" stroke-width="3"/><text x="690.0" y="702.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" fill="#262437"><tspan x="690.0" dy="0">Posicion_Camara</tspan><tspan x="690.0" dy="29.900000000000002">ocupación histórica</tspan></text><rect x="1005" y="657" width="350" height="120" fill="#eeeeee"/><rect x="1000" y="650" width="350" height="120" fill="#fff1f2" stroke="#fb6d77" stroke-width="3"/><text x="1175.0" y="702.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" fill="#262437"><tspan x="1175.0" dy="0">Pallet_FCL</tspan></text><path d="M210 205 V260 H270 V330" fill="none" stroke="#292929" stroke-width="2.5"/><rect x="186" y="221" width="148" height="31" fill="white"/><text x="260" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#262437"><tspan x="260" dy="0">1 → 0..N</tspan></text><path d="M560 205 V275 H420 V330" fill="none" stroke="#292929" stroke-width="2.5"/><rect x="466" y="236" width="148" height="31" fill="white"/><text x="540" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#262437"><tspan x="540" dy="0">1 → 1..N</tspan></text><path d="M790 205 V330" fill="none" stroke="#292929" stroke-width="2.5"/><rect x="791" y="251" width="148" height="31" fill="white"/><text x="865" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#262437"><tspan x="865" dy="0">1 → 0..N</tspan></text><path d="M700 445 V535 H240 V650" fill="none" stroke="#292929" stroke-width="2.5"/><rect x="306" y="501" width="148" height="31" fill="white"/><text x="380" y="525" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#262437"><tspan x="380" dy="0">1 → 0..N</tspan></text><path d="M825 445 V565 H690 V650" fill="none" stroke="#292929" stroke-width="2.5"/><rect x="756" y="531" width="148" height="31" fill="white"/><text x="830" y="555" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#262437"><tspan x="830" dy="0">1 → 0..N</tspan></text><path d="M950 445 V540 H1080 V650" fill="none" stroke="#292929" stroke-width="2.5"/><rect x="1036" y="506" width="148" height="31" fill="white"/><text x="1110" y="530" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#262437"><tspan x="1110" dy="0">1 → 0..N</tspan></text><path d="M1200 205 V650" fill="none" stroke="#292929" stroke-width="2.5"/><rect x="1201" y="426" width="148" height="31" fill="white"/><text x="1275" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#262437"><tspan x="1275" dy="0">1 → 1..N</tspan></text><text x="700" y="820" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#262437"><tspan x="700" dy="0">Convención: 1 padre por registro asociado; multiplicidad indicada del padre a sus registros.</tspan></text><text x="700" y="852" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#262437"><tspan x="700" dy="0">Pallet_FCL conserva historial de asignaciones; a lo sumo una asignación activa por pallet [DE].</tspan></text><text x="700" y="884" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#262437"><tspan x="700" dy="0">Posicion_Camara: varios periodos por pallet, sin solapamiento; posición actual = periodo abierto [DE].</tspan></text><text x="700" y="925" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#262437"><tspan x="700" dy="0">Las series térmicas y transferencias de custodia requieren evidencia adicional (NV-05 / REQ-04).</tspan></text><text x="700" y="955" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#262437"><tspan x="700" dy="0">Identidad conceptual ≠ esquema físico validado; relaciones e IDs no prueban cobertura ni rendimiento.</tspan></text></svg>