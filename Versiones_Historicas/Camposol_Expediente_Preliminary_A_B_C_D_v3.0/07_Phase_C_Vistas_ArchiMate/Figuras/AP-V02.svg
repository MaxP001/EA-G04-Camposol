<text x="26" y="596" font-size="12" fill="#5f6b73">AP-V02 · VP-C05 · C01/C05 · Grupo 04 · v3.0 · Target (D) · componentes Target = ABB lógicos nuevos, sin producto</text>
<text x="26" y="613" font-size="12" fill="#5f6b73">Componente → función (Assignment) → servicio (Realization) → proceso de negocio (Serving). ASV-01 también sirve a BP-02, BP-05 y BP-06</text>
<text x="26" y="630" font-size="12" fill="#5f6b73">(C2/App_x_Proceso).</text>
<text x="26" y="647" font-size="12" fill="#5f6b73">Interfaces y contratos IF: AP-V03.</text>
<text x="26" y="664" font-size="11" fill="#7c868d">Notación ArchiMate 3.2: Assignment (●→) · Realization (- - ▷) · Serving (→ abierta) · Access (··· ; flecha = dirección del dato: escribe →objeto, lee</text>
<text x="26" y="681" font-size="11" fill="#7c868d">→proceso) · Triggering (→ llena) · Flow (- - → llena) · Composition (◆) · Aggregation (◇) · Influence (- - →, +) · Association (—). Anidamiento = relación</text>
<text x="26" y="698" font-size="11" fill="#7c868d">estructural del modelo.</text>
