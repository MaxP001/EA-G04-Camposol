<text x="26" y="512.0" font-size="12" fill="#5f6b73">D-V01 · VP-C01 · C01 · Grupo 04 · v3.0 · Baseline simulado (DS-CS-13/19)</text>
<text x="26" y="529.0" font-size="12" fill="#5f6b73">Cada fuente guarda su propio código (R-, B-, PAL-, QA-, CAM-, EMB-); solo la planilla puente AP-07 los relaciona, a mano y sin steward.</text>
<text x="26" y="546.0" font-size="12" fill="#5f6b73">Concern acotado a datos (Access); los flujos entre aplicaciones Baseline están en AP-V01.</text>
<text x="26" y="563.0" font-size="11" fill="#7c868d">Notación ArchiMate 3.2: Assignment (●→) · Realization (- - ▷) · Serving (→ abierta) · Access (··· ; flecha = dirección del dato: escribe →objeto, lee →proceso) · Triggering (→ llena) · Flow (- - → llena) · Composition (◆) · Aggregation (◇)</text>
<text x="26" y="580.0" font-size="11" fill="#7c868d">· Influence (- - →, +) · Association (—). Anidamiento = relación estructural del modelo.</text>
