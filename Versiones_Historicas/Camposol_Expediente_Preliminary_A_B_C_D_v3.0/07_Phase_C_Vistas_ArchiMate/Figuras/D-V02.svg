<text x="26" y="596" font-size="12" fill="#5f6b73">D-V02 · VP-C02 · C01/C06/C07 · Grupo 04 · v3.0 · Target (D) · modelo conceptual, no esquema físico</text>
<text x="26" y="613" font-size="12" fill="#5f6b73">Lot es la identidad canónica; LotGenealogy une padre e hijo (división y mezcla N:M, DS-CS-15); QAResult versionado solo lo escribe ROL-B05</text>
<text x="26" y="630" font-size="12" fill="#5f6b73">(PR-07).</text>
<text x="26" y="647" font-size="12" fill="#5f6b73">Las etiquetas son la cardinalidad de cada Association. LotHistory (DOBJ-12) agrega estos objetos: D-V03 y X-V01.</text>
<text x="26" y="664" font-size="11" fill="#7c868d">Notación ArchiMate 3.2: Assignment (●→) · Realization (- - ▷) · Serving (→ abierta) · Access (··· ; flecha = dirección del dato: escribe →objeto, lee</text>
<text x="26" y="681" font-size="11" fill="#7c868d">→proceso) · Triggering (→ llena) · Flow (- - → llena) · Composition (◆) · Aggregation (◇) · Influence (- - →, +) · Association (—). Anidamiento = relación</text>
<text x="26" y="698" font-size="11" fill="#7c868d">estructural del modelo.</text>
