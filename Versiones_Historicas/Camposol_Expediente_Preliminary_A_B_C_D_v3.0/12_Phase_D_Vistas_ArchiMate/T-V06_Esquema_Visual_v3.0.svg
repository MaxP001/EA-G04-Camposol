<text x="26" y="658.0" font-size="12" fill="#5f6b73">T-V06 · VP-D06 · C03/C05 · Grupo 04 · v3.0</text>
<text x="26" y="675.0" font-size="12" fill="#5f6b73">Target (D) · ABB lógicos sin producto. Cada Grouping T-ABB agrega los servicios tecnológicos de un bloque: captura, control autónomo, corredor seguro, transporte resiliente, persistencia, ejecución/identidad/integración, observabilidad y sensado visual opcional. TSV-C01</text>
<text x="26" y="692.0" font-size="12" fill="#5f6b73">(candidato de Phase A) se detalla en TS-01 y TS-02. Requisito NFR-T que realiza cada servicio: T1/04 y T1/11; nodos que los realizan: T-V03, T-V05 y T-V09.</text>
<text x="26" y="709.0" font-size="11" fill="#7c868d">Notación ArchiMate 3.2: Assignment (●→) · Realization (- - ▷) · Serving (→ abierta) · Access (··· ; flecha = dirección del dato) · Triggering (→ llena) · Flow (- - → llena) · Composition (◆) · Aggregation (◇) · Association (—). Anidamiento = relación estructural del modelo (Aggregation,</text>
<text x="26" y="726.0" font-size="11" fill="#7c868d">Composition o Assignment).</text>
